<html lang="es">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      color-scheme: light;
      --navy: #111111;
      --navy-deep: #000000;
      --blue: #168aad;
      --sky: #edf7fa;
      --sky-strong: #d9eff5;
      --bg: #f5f5f5;
      --surface: #fff;
      --line: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --green: #15803d;
      --red: #c2413b;
      --amber: #a16207;
      --shadow: 0 18px 45px rgba(15, 23, 42, .1);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 256px; flex: 0 0 256px; background: #050505; color: #fff; display: flex; flex-direction: column; padding: 26px 16px; box-shadow: 8px 0 28px rgba(15, 23, 42, .08); z-index: 1; transition: width .2s ease, flex-basis .2s ease, padding .2s ease; }
    .sidebar.collapsed { width: 76px; flex-basis: 76px; padding-right: 10px; padding-left: 10px; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 2px 10px 34px; }
    .brand-copy { min-width: 0; overflow: hidden; white-space: nowrap; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 800; font-size: 20px; box-shadow: 0 5px 16px rgba(22, 138, 173, .2); }
    .brand strong { display: block; font-size: 17px; letter-spacing: .3px; }
    .brand small { color: #a9c2d4; font-size: 11px; }
    .nav-label { padding: 10px 12px; color: #89a8bf; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .nav { display: grid; gap: 6px; }
    .nav button { display: flex; align-items: center; gap: 12px; min-height: 44px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: #c2d5e2; text-align: left; padding: 10px 12px; font-size: 13px; font-weight: 550; transition: .18s ease; }
    .nav-icon { width: 18px; height: 18px; flex: 0 0 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
    .nav button.active { background: rgba(255, 255, 255, .1); color: #fff; border-color: rgba(255, 255, 255, .08); box-shadow: inset 3px 0 var(--blue); }
    .sidebar.collapsed .brand { justify-content: center; padding-right: 0; padding-left: 0; }
    .sidebar.collapsed .brand-copy, .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-text, .sidebar.collapsed .side-footer-copy { display: none; }
    .sidebar.collapsed .nav button { justify-content: center; padding-right: 0; padding-left: 0; }
    .sidebar.collapsed .side-footer { display: flex; justify-content: center; padding-right: 0; padding-left: 0; }
    .sidebar.collapsed .side-footer-mark { display: block; }
    .side-footer { margin-top: auto; border-top: 1px solid rgba(255,255,255,.14); padding: 18px 10px 0; color: #c2d5e2; font-size: 12px; line-height: 1.6; }
    .side-footer strong { color: #fff; }
    .side-footer-mark { display: none; }
    .main { flex: 1; min-width: 0; }
    .topbar { height: 76px; padding: 0 38px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,.92); border-bottom: 1px solid var(--line); }
    .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .sidebar-toggle { width: 38px; height: 38px; display: inline-grid; place-items: center; flex: 0 0 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); transition: .16s ease; }
    .sidebar-toggle:hover { border-color: var(--blue); background: var(--sky); color: var(--navy); }
    .sidebar-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }

    .topbar-right { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
    .theme-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 11px; font-weight: 650; transition: .16s ease; }
    .theme-toggle:hover { border-color: var(--blue); background: var(--sky); }
    .theme-toggle svg { width: 15px; height: 15px; }
    .connection { display: inline-flex; align-items: center; gap: 7px; }
    .connection::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
    .connection.online::before { background: #22c55e; }
    .connection.error::before { background: #ef4444; }
    .content { max-width: 1480px; width: 100%; margin: 0 auto; padding: 36px 38px 52px; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 25px; }
    .page-head h2 { margin: 0; color: var(--navy); font-size: 24px; font-weight: 700; letter-spacing: -.55px; }
    .page-head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; }
    .btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 39px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--navy); font-size: 12px; font-weight: 650; box-shadow: 0 1px 2px rgba(15,23,42,.04); transition: .16s ease; }
    .btn:hover { transform: translateY(-1px); border-color: #9bd8e6; background: var(--sky); box-shadow: 0 4px 10px rgba(15,23,42,.06); }
    .btn.primary { background: #111; border-color: #111; color: #fff; }
    .btn.primary:hover { background: #292929; border-color: #292929; }
    .btn.danger { border-color: #efb5b1; color: var(--red); }
    .btn.danger:hover { border-color: var(--red); background: #fdeceb; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat { min-height: 128px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 1px 3px rgba(15,23,42,.04), 0 5px 14px rgba(15,23,42,.025); transition: transform .16s ease, box-shadow .16s ease; }
    .stat:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(15,23,42,.07); }
    .stat-label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; }
    .stat-value { margin-top: 17px; color: var(--navy); font-size: 26px; font-weight: 750; letter-spacing: -.5px; overflow-wrap: anywhere; }
    .stat-value.money { font-size: 23px; }
    .stat-hint { margin-top: 7px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 1px 3px rgba(15,23,42,.04), 0 5px 14px rgba(15,23,42,.025); }
    .panel-head { min-height: 62px; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); }
    .panel-head h3 { margin: 0; color: var(--navy); font-size: 14px; }
    .panel-head input { max-width: 280px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; font-size: 12px; }
    th { background: #f8fafc; color: #64748b; font-size: 10px; font-weight: 700; letter-spacing: .7px; text-align: left; text-transform: uppercase; padding: 14px 16px; white-space: nowrap; }
    td { padding: 14px 16px; border-top: 1px solid #edf2f5; vertical-align: middle; }
    tbody tr { transition: background .12s ease; }
    tbody tr:hover { background: #f4fbfd; }
    .empty { padding: 42px 16px; text-align: center; color: var(--muted); }
    .mono { color: #698096; font-family: Consolas, monospace; font-size: 11px; }
    .pill { display: inline-flex; padding: 5px 9px; border-radius: 999px; background: #eef4f7; color: #587087; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .pill.completed { background: #e8f7ed; color: var(--green); }
    .pill.pending { background: #fff5dc; color: var(--amber); }
    .pill.failed { background: #fdeceb; color: var(--red); }
    .pill.type { background: var(--sky); color: #13718e; }
    .table-btn { width: 31px; height: 31px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--blue); font-weight: 700; }
    .table-btn:hover { background: var(--sky); }
    .table-btn.danger { color: var(--red); }
    .table-btn.danger:hover { background: #fdeceb; border-color: #efb5b1; }
    .table-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .export-excel { color: #166534; }
    .export-pdf { color: #b42318; }
    .inline-note { margin: 0 18px 16px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .association-list { display: grid; gap: 14px; padding: 16px; }
    .association-card { padding: 17px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .association-tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 18px 0; }
    .association-tab-active { background: var(--navy); border-color: var(--navy); color: #fff; }
    .association-tab .tab-count { margin-left: 5px; opacity: .72; }
    .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; padding: 18px; }
    .store-card { position: relative; overflow: hidden; padding: 19px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(145deg, var(--surface), var(--bg)); box-shadow: 0 8px 22px rgba(0,0,0,.07); }
    .store-card::before { position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--blue); content: ""; }
    .store-card-head { display: flex; align-items: flex-start; gap: 13px; }
    .store-avatar { width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center; border-radius: 14px; background: var(--navy); color: var(--surface); font-size: 17px; font-weight: 800; letter-spacing: .5px; }
    .store-card-copy { min-width: 0; flex: 1; }
    .store-card-copy h3 { margin: 2px 0 5px; color: var(--navy); font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
    .store-card-copy p { margin: 0; color: var(--muted); font-size: 11px; }
    .store-owner { display: flex; align-items: center; gap: 9px; margin: 17px 0 13px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
    .store-owner-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--sky-strong); color: var(--blue); font-size: 13px; font-weight: 800; }
    .store-owner span { display: block; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; }
    .store-owner strong { display: block; margin-top: 3px; color: var(--text); font-size: 12px; overflow-wrap: anywhere; }
    .store-card-meta { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 12px; }
    .store-card-meta span { padding: 5px 8px; border-radius: 999px; background: var(--sky); color: var(--muted); font-size: 10px; font-weight: 650; }
    .store-card .association-actions { padding-top: 12px; border-top: 1px solid var(--line); }
    .dashboard-charts { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, 1fr); gap: 16px; margin: 0 0 24px; }
    .chart-panel { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 5px 18px rgba(0,0,0,.045); }
    .chart-head { padding: 19px 20px 8px; }
    .chart-head h3 { margin: 0; color: var(--navy); font-size: 14px; }
    .chart-head p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .chart-body { padding: 10px 16px 18px; }
    .monthly-chart { display: block; width: 100%; height: auto; overflow: visible; }
    .monthly-chart text { fill: var(--muted); font-family: inherit; font-size: 10px; }
    .monthly-chart .chart-gridline { stroke: var(--line); stroke-dasharray: 4 5; }
    .monthly-chart .chart-bar { fill: var(--blue); opacity: .84; }
    .monthly-chart .chart-bar-current { fill: #38bdf8; opacity: 1; }
    .donut-layout { display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 210px; }
    .donut-chart { width: 164px; height: 164px; flex: 0 0 164px; }
    .donut-chart .donut-track { fill: none; stroke: var(--line); stroke-width: 15; }
    .donut-chart .donut-segment { fill: none; stroke-width: 15; stroke-linecap: butt; transform: rotate(-90deg); transform-origin: 60px 60px; }
    .donut-chart .donut-total { fill: var(--navy); font-size: 21px; font-weight: 750; text-anchor: middle; }
    .donut-chart .donut-caption { fill: var(--muted); font-size: 8px; text-anchor: middle; }
    .chart-legend { display: grid; gap: 10px; min-width: 110px; }
    .chart-legend-item { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; }
    .chart-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .chart-legend-item strong { color: var(--text); font-size: 10px; }
    .charts-secondary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
    :root[data-theme="dark"] .association-tab-active { background: var(--blue); border-color: var(--blue); color: #06131a; }
    :root[data-theme="dark"] .store-card { box-shadow: 0 8px 22px rgba(0,0,0,.2); }
    :root[data-theme="dark"] .store-avatar { color: #fff; }
    :root[data-theme="dark"] .monthly-chart .chart-bar { fill: #168aad; }
    :root[data-theme="dark"] .monthly-chart .chart-bar-current { fill: #38bdf8; }
    .association-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .association-card h3 { margin: 0; color: var(--navy); font-size: 14px; }
    .association-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 7px 16px; margin: 13px 0; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .association-controls { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr); gap: 9px; margin-top: 13px; }
    .association-controls input, .association-controls select { min-height: 39px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 12px; }
    .association-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .status-review { background: #fff5dc; color: var(--amber); }
    .association-tabs { display: flex; gap: 8px; padding: 14px 16px 0; }
    .association-tab-active { background: var(--navy); border-color: var(--navy); color: #fff; }
    .association-tab-panel { padding: 0 16px 18px; }
    .ip-section-intro { margin: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--muted); font-size: 12px; line-height: 1.6; }

    .field textarea { min-height: 76px; resize: vertical; }

    .checkbox-field { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); cursor: pointer; }
    .checkbox-field input { width: 16px; height: 16px; min-height: 0; margin: 0; accent-color: var(--blue); }
    .checkbox-field span { font-size: 12px; font-weight: 600; }
    .search { background: #f8fafc; }
    .search::placeholder { color: #94a3b8; }
    .toast-region { position: fixed; right: 20px; bottom: 20px; z-index: 10; display: grid; gap: 8px; }
    .toast { max-width: min(420px, calc(100vw - 40px)); padding: 12px 16px; border-radius: 9px; background: var(--navy); color: #fff; box-shadow: var(--shadow); font-size: 12px; }
    .toast.error { background: #9f302b; }
    .toast.success { background: #17683b; }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --navy: #f4f4f5;
      --navy-deep: #e4e4e7;
      --blue: #38bdf8;
      --sky: #191919;
      --sky-strong: #262626;
      --bg: #090909;
      --surface: #111111;
      --line: #292929;
      --text: #ededed;
      --muted: #a1a1aa;
      --green: #4ade80;
      --red: #f87171;
      --amber: #fbbf24;
      --shadow: 0 18px 45px rgba(0, 0, 0, .32);
    }
    :root[data-theme="dark"] .brand-mark { color: #fff; }
    :root[data-theme="dark"] .sidebar { background: #000; }
    :root[data-theme="dark"] .topbar { background: rgba(10, 10, 10, .96); }
    :root[data-theme="dark"] .btn,
    :root[data-theme="dark"] .table-btn { background: #171717; color: var(--text); }
    :root[data-theme="dark"] .btn:hover,
    :root[data-theme="dark"] .table-btn:hover { background: #262626; }
    :root[data-theme="dark"] .btn.primary { background: #168aad; border-color: #168aad; color: #fff; }
    :root[data-theme="dark"] .btn.primary:hover { background: #11728f; }
    :root[data-theme="dark"] th { background: #171717; color: #b4b4b8; }
    :root[data-theme="dark"] td { border-color: #292929; }
    :root[data-theme="dark"] tbody tr:hover { background: #171717; }
    :root[data-theme="dark"] .mono { color: #9aabc0; }
    :root[data-theme="dark"] .pill { background: #262626; color: #d4d4d8; }
    :root[data-theme="dark"] .pill.completed { background: #123a2b; color: #86efac; }
    :root[data-theme="dark"] .pill.pending { background: #423313; color: #fcd34d; }
    :root[data-theme="dark"] .pill.failed { background: #451f24; color: #fca5a5; }
    :root[data-theme="dark"] .pill.type { background: #12364a; color: #7dd3fc; }
    :root[data-theme="dark"] .table-btn.danger:hover { background: #451f24; border-color: #7f3039; }
    :root[data-theme="dark"] .modal { background: var(--surface); }
    :root[data-theme="dark"] .field label { color: #c4c4c8; }
    :root[data-theme="dark"] .checkbox-field { color: var(--text); }
    :root[data-theme="dark"] .store-owner { background: #090909; }
    :root[data-theme="dark"] .store-owner-icon { background: #12364a; }
    :root[data-theme="dark"] .store-card-meta span { background: #1c1c1c; }
    :root[data-theme="dark"] .field input,
    :root[data-theme="dark"] .field select,
    :root[data-theme="dark"] .field textarea,
    :root[data-theme="dark"] .search,
    :root[data-theme="dark"] .ip-rule-form input,
    :root[data-theme="dark"] .ip-rule-form select,
    :root[data-theme="dark"] .association-controls input,
    :root[data-theme="dark"] .association-controls select { background: #090909; color: var(--text); border-color: var(--line); }
    :root[data-theme="dark"] .search::placeholder { color: #7e90a7; }
    :root[data-theme="dark"] .modal-head,
    :root[data-theme="dark"] .modal-foot { border-color: var(--line); }
    :root[data-theme="dark"] .export-excel { color: #86efac; }
    :root[data-theme="dark"] .export-pdf { color: #fca5a5; }
    @media (max-width: 980px) {
      .sidebar { width: 224px; flex-basis: 224px; }
      .content { padding: 24px 20px 36px; }
      .topbar { padding: 0 20px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .layout { display: block; }
      .sidebar, .sidebar.collapsed { width: 100%; flex-basis: auto; padding: 12px; }
      .sidebar.collapsed { display: none; }
      .brand { padding: 0 6px 12px; }
      .sidebar.collapsed .brand { display: flex; }
      .sidebar.collapsed .brand-copy { display: block; }
      .nav-label, .side-footer { display: none; }
      .sidebar.collapsed .nav-label, .sidebar.collapsed .side-footer { display: none; }
      .sidebar.collapsed .nav-text { display: inline; }
      .nav { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
      .nav button, .sidebar.collapsed .nav button { justify-content: center; padding: 10px 5px; text-align: center; font-size: 10px; }
      .nav button.active { box-shadow: inset 0 -3px var(--blue); }
      .topbar { height: 58px; padding: 0 15px; }
      .topbar-left { gap: 9px; }
      .sidebar-toggle { width: 34px; height: 34px; flex-basis: 34px; }
      .topbar h1 { font-size: 15px; }
      .topbar-right { gap: 8px; font-size: 10px; }
      .theme-toggle { min-height: 34px; padding: 6px 8px; }
      .content { padding: 20px 14px 30px; }
      .stats { gap: 9px; }
      .stat { min-height: 105px; padding: 13px; }
      .stat-value { margin-top: 13px; font-size: 22px; }
      .stat-value.money { font-size: 18px; }
      .modal-body { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .map-tools { grid-template-columns: minmax(0, 1fr) auto; }
      .map-search { grid-column: 1 / -1; }
      .panel-head { align-items: stretch; flex-direction: column; }
      .panel-head input { max-width: none; }
    }
  </style>
</head>
<body>
  <div class="layout">

      <div class="nav-label">Administración</div>
      <nav class="nav" aria-label="Navegación principal">
        <button class="active" data-view="dashboard" aria-label="Resumen" title="Resumen"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"></path></svg><span class="nav-text">Resumen</span></button>
        <button data-view="users" aria-label="Usuarios" title="Usuarios"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span class="nav-text">Usuarios</span></button>
        <button data-view="transactions" aria-label="Transacciones" title="Transacciones"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20M7 15h3"></path></svg><span class="nav-text">Transacciones</span></button>
        <button data-view="transfer" aria-label="Transferir o descontar" title="Transferir o descontar"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"></path></svg><span class="nav-text">Transferir / descontar</span></button>
        <button data-view="products" aria-label="Productos" title="Productos"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18l-2 14H5L3 7zM8 7a4 4 0 0 1 8 0M8 11v2m8-2v2"></path></svg><span class="nav-text">Productos</span></button>
        <button data-view="locations" aria-label="Lugares de recogida" title="Lugares de recogida"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"></path><circle cx="12" cy="10" r="2.5"></circle></svg><span class="nav-text">Lugares de recogida</span></button>
        <button data-view="associationRequests" aria-label="Solicitudes de asociados" title="Solicitudes"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg><span class="nav-text">Solicitudes</span></button>
        <button data-view="associationHistory" aria-label="Historial de asociados" title="Historial de asociados"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"></path></svg><span class="nav-text">Historial asociados</span></button>
        <button data-view="userIps" aria-label="IPs de usuarios" title="IPs de usuarios"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg><span class="nav-text">IPs de usuarios</span></button>
        <button data-view="controlIps" aria-label="IPs de control" title="IPs de control"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7l8-4z"></path><path d="M9 12l2 2 4-4"></path></svg><span class="nav-text">IPs de control</span></button>
      </nav>
      <div class="side-footer"><span class="side-footer-copy">Proyecto<br><strong>GIKO</strong></span><strong class="side-footer-mark" aria-hidden="true">G</strong></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Contraer menú" title="Contraer menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
          <h1 id="pageTitle">Resumen general</h1>
        </div>
        <div class="topbar-right">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a tema oscuro"></button>
          <span id="connection" class="connection">Conectando</span>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite">
        <div class="panel"><div class="empty">Conectando con Supabase...</div></div>
      </section>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal" id="recordForm">
      <div class="modal-head"><h3 id="modalTitle"></h3><button type="button" id="modalClose" aria-label="Cerrar">&times;</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot"><button class="btn" type="button" id="modalCancel">Cancelar</button><button class="btn" type="button" id="modalBack" hidden>Volver al mapa</button><button class="btn primary" type="submit" id="modalSubmit">Guardar</button></div>
    </form>
  </div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <script>
    const SUPABASE_URL = 'https://jxpssplhcytqqjiqnpeu.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_apHvBdktiuIcsrpx423yIg_o-d7XFMp';
    const PAGE_SIZE = 1000;
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
    });
    const state = { view: 'dashboard', users: [], transactions: [], recharges: [], products: [], locations: [], associations: [], categories: [], search: '', ipRules: [], userIps: [] };
    const content = document.getElementById('content');
    const backdrop = document.getElementById('modalBackdrop');
    const form = document.getElementById('recordForm');
    let editingUserId = null;
    let editingTransactionId = null;
    let editingCatalog = null;
    let editingIpRecord = null;
    let locationDetailsStep = false;
    let locationDraft = null;
    let pickupMap = null;
    let pickupMarker = null;
    let currentLocationMarker = null;
    let geocodeController = null;
    let geocodeTimeout = null;
    let geocodeRequestId = 0;
    let currentLocationRequestId = 0;

    const titles = {
      dashboard: 'Resumen general',
      users: 'Usuarios',
      transactions: 'Transacciones',
      transfer: 'Transferir / descontar',
      products: 'Productos',
      locations: 'Lugares de recogida',
      associationRequests: 'Solicitudes de asociados',
      associationHistory: 'Historial de asociados',
      userIps: 'IPs de usuarios',
      controlIps: 'IPs de control'
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    function money(value) {
      const amount = Number(value);
      return `Bs ${Number.isFinite(amount) ? amount.toFixed(2) : '0.00'}`;
    }

    function date(value) {
      if (!value) return '—';
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? '—' : parsed.toLocaleString('es-BO');
    }

    function shortId(value) {
      const id = String(value ?? '');
      return id ? `<span class="mono" title="${escapeHtml(id)}">${escapeHtml(id.slice(0, 8))}…</span>` : '—';
    }

    function toast(message, type = '') {
      const item = document.createElement('div');
      item.className = `toast ${type}`;
      item.textContent = message;
      document.getElementById('toasts').appendChild(item);
      window.setTimeout(() => item.remove(), 4200);
    }

    function statusPill(status) {
      const known = { completed: 'Completada', pending: 'Pendiente', failed: 'Fallida' };
      const label = known[status] || status || '—';
      const className = ['completed', 'pending', 'failed'].includes(status) ? status : '';
      return `<span class="pill ${className}">${escapeHtml(label)}</span>`;
    }

    function typeLabel(type) {
      return ({ deposit: 'Depósito', withdrawal: 'Retiro', transfer: 'Transferencia', recharge: 'Recarga' })[type] || type || '—';
    }

    async function fetchAll(table, columns, orderColumn) {
      const rows = [];
      for (let offset = 0; ; offset += PAGE_SIZE) {
        let query = db.from(table).select(columns).range(offset, offset + PAGE_SIZE - 1);
        if (orderColumn) query = query.order(orderColumn, { ascending: false });
        const { data, error } = await query;
        if (error) throw error;
        rows.push(...(data || []));
        if (!data || data.length < PAGE_SIZE) return rows;
      }
    }

    async function loadData() {
      setConnection('Cargando', '');
      try {
        const [users, transactions, recharges, products, locations] = await Promise.all([
          fetchAll('user_profiles', 'id, full_name, email, phone, avatar_url, created_at, updated_at', 'created_at'),
          fetchAll('transactions', 'id, user_id, amount, type, description, status, metadata, created_at', 'created_at'),
          fetchAll('game_recharges', 'id, user_id, game, game_id, player_name, region, diamonds, amount, transaction_id, status, created_at, updated_at', 'created_at'),
          fetchAll('products', 'id, name, description, price, stock, category, image_url, is_active, is_featured, discount_percentage, created_at, updated_at', 'created_at'),
          fetchAll('pickup_locations', 'id, name, address, latitude, longitude, schedule, is_active, created_at', 'created_at')
        ]);
        state.users = users;
        state.transactions = transactions;
        state.recharges = recharges;
        state.products = products;
        state.locations = locations;
        setConnection('Conectado', 'online');
        render();
      } catch (error) {
        console.error('Error cargando datos de GIKO:', error);
        setConnection('Error de conexión', 'error');
        content.innerHTML = `<div class="panel"><div class="empty">No se pudieron cargar los datos: ${escapeHtml(error.message || 'Error desconocido')}<br><br><button class="btn" onclick="loadData()">Reintentar</button></div></div>`;
        toast(`Error al cargar datos: ${error.message || 'Error desconocido'}`, 'error');
      }
    }

    function setConnection(text, className) {
      const element = document.getElementById('connection');
      element.textContent = text;
      element.className = `connection ${className}`;
    }

    function getUser(userId) {
      return state.users.find(user => user.id === userId);
    }

    function userName(userId) {
      const user = getUser(userId);
      return user ? (user.full_name || user.email || user.id) : userId || '—';
    }

    function balancesByUser(transactions = state.transactions) {
      const balances = Object.fromEntries(state.users.map(user => [user.id, 0]));
      for (const transaction of transactions) {
        if (transaction.status !== 'completed') continue;
        const amount = Number(transaction.amount);
        if (!Number.isFinite(amount)) continue;
        const userId = transaction.user_id;
        if (transaction.type === 'deposit') balances[userId] = (balances[userId] || 0) + amount;
        if (transaction.type === 'withdrawal' || transaction.type === 'recharge') balances[userId] = (balances[userId] || 0) - amount;
        if (transaction.type === 'transfer') {
          if (transaction.metadata?.admin_credit === true) {
            balances[userId] = (balances[userId] || 0) + amount;
          } else {
            balances[userId] = (balances[userId] || 0) - amount;
            const recipient = transaction.metadata?.to_user_id || transaction.metadata?.recipient_id;
            if (recipient && recipient in balances) balances[recipient] += amount;
          }
        }
      }
      return balances;
    }

    function render() {
      document.getElementById('pageTitle').textContent = titles[state.view];
      document.querySelectorAll('.nav button').forEach(button => {
        button.classList.toggle('active', button.dataset.view === state.view);
      });
      if (state.view === 'dashboard') renderDashboard();
      else if (state.view === 'users') renderUsers();
      else if (state.view === 'transactions') renderTransactions();
      else if (state.view === 'transfer') renderTransfer();
      else if (state.view === 'products') renderCatalog('products');
      else if (state.view === 'locations') renderCatalog('locations');
      else if (state.view === 'associationRequests') renderAssociationRequests();
      else if (state.view === 'associationHistory') renderAssociationHistory();
      else if (state.view === 'userIps') renderUserIps();
      else if (state.view === 'controlIps') renderControlIps();
    }

    function pageHeader(title, subtitle, button = '') {
      return `<div class="page-head"><div><h2>${title}</h2><p>${subtitle}</p></div><div class="actions"><button class="btn" id="refreshButton">Actualizar datos</button>${button}</div></div>`;
    }

    function exportButtons() {
      return '<button class="btn export-excel" data-export="excel">Excel</button><button class="btn export-pdf" data-export="pdf">PDF</button>';
    }

    function bindRefresh() {
      document.getElementById('refreshButton')?.addEventListener('click', loadData);
    }

    function bindExports(table) {
      content.querySelectorAll('[data-export]').forEach(button => {
        button.addEventListener('click', () => {
          if (button.dataset.export === 'excel') exportExcel(table);
          else exportPdf(table);
        });
      });
    }

    function renderAssociationRequests() {
      content.innerHTML = `
        ${pageHeader('Solicitudes de asociados', 'Solicitudes pendientes o en revisión para aprobación.')}
        <section class="panel">
          <div class="panel-head"><h3>Solicitudes por revisar</h3><button class="btn" id="refreshAssociations">Actualizar</button></div>
          <div id="associationList" class="table-wrap"><div class="empty">Cargando solicitudes...</div></div>
        </section>`;
      document.getElementById('refreshAssociations').addEventListener('click', loadAssociations);
      bindRefresh();
      loadAssociations();
    }

    function renderAssociationHistory() {
      content.innerHTML = `
        ${pageHeader('Historial de asociados', 'Directorio visual de tiendas aprobadas y sus dueñas.')}
        <section class="panel">
          <div class="panel-head"><h3>Tiendas asociadas</h3><button class="btn" id="refreshAssociations">Actualizar</button></div>
          <div id="approvedStores" class="store-grid"><div class="empty">Cargando tiendas aprobadas...</div></div>
        </section>`;
      document.getElementById('refreshAssociations').addEventListener('click', loadAssociations);
      bindRefresh();
      loadAssociations();
    }
    function renderUserIps() {
      content.innerHTML = `
        ${pageHeader('IPs de usuarios', 'Consulta y administra el historial de IP guardado por usuario.')}
        <div id="ipAccessStats" class="stats"></div>
        <section class="panel">
          <div class="panel-head"><span><h3>Registro de accesos por usuario</h3><p>Edita la IP, usuario, actividad y estado sospechoso de cada registro.</p></span><button class="btn" id="refreshUserIpData">Actualizar</button></div>
          <div class="ip-user-form"><p>Registros guardados en <code>ips_usuarios</code>. Cada cambio afecta únicamente al acceso seleccionado.</p><button type="button" class="btn primary" id="createUserIp">Registrar IP de usuario</button></div>
          <p class="ip-section-intro"><strong>Nota:</strong> se muestran los registros existentes en <code>ips_usuarios</code>. Los cambios y eliminaciones se aplican únicamente al registro seleccionado.</p>
          <div id="ipAccessLogs" class="table-wrap"><div class="empty">Cargando accesos...</div></div>
        </section>`;
      document.getElementById('refreshUserIpData').addEventListener('click', loadIpData);
      document.getElementById('createUserIp').addEventListener('click', openNewUserIpModal);
      bindRefresh();
      loadIpData();
    }

    function renderControlIps() {
      content.innerHTML = `
        ${pageHeader('IPs de control', 'Gestiona reglas de acceso y políticas por dirección IP.')}
        <section class="panel">
          <div class="panel-head"><span><h3>Reglas de control de IP</h3><p>Autoriza o bloquea direcciones que usa el acceso a tiendas.</p></span><button class="btn" id="refreshIpRules">Actualizar</button></div>
          <p class="ip-section-intro"><strong>Lista blanca:</strong> autoriza la IP. Si esa dirección aparece en <code>ips_usuarios</code>, se muestran también los usuarios registrados con ella. <strong>Lista negra:</strong> bloquea la dirección. <strong>EsEkaus:</strong> conserva la regla especial. La autorización se aplica al acceso del portal mediante <code>register_seller_access</code>.</p>
          <form id="ipRuleForm" class="ip-rule-form">
            <label>IP o rango CIDR<input id="ipRuleAddress" type="text" maxlength="64" placeholder="Ej. 192.0.2.10 o 192.0.2.0/24" autocomplete="off" required></label>
            <label>Acción<select id="ipRuleAction"><option value="blanca">Lista blanca · Autorizar</option><option value="negra">Lista negra · Bloquear</option><option value="esekaus">EsEkaus · Control especial</option></select></label>
            <label>Motivo<input id="ipRuleReason" type="text" maxlength="240" placeholder="Por qué se agrega esta IP"></label>
            <div class="ip-rule-actions"><button type="submit" class="btn primary">Agregar regla</button></div>
          </form>
          <div class="ip-rules-heading">Reglas registradas</div>
          <div id="ipRulesList" class="table-wrap"><div class="empty">Cargando reglas...</div></div>
        </section>`;
      document.getElementById('refreshIpRules').addEventListener('click', loadIpData);
      document.getElementById('ipRuleForm').addEventListener('submit', saveIpRule);

    function validateIpAddress(value, allowCidr = true) {
      const normalized = value.trim().toLowerCase();
      const parts = normalized.split('/');
      if (!normalized || parts.length > 2 || (parts.length === 2 && !allowCidr)) {
        throw new Error('Escribe una dirección IP válida.');
      }
      const address = parts[0];
      const ipv4Parts = address.split('.');
      const isIpv4 = ipv4Parts.length === 4 && ipv4Parts.every(part =>
        /^\d{1,3}$/.test(part) && (part === '0' || !part.startsWith('0')) && Number(part) >= 0 && Number(part) <= 255
      );
      const isIpv6 = address.includes(':') && isValidIpv6(address);
      if (!isIpv4 && !isIpv6) {
        throw new Error('La IP debe ser IPv4 o IPv6 válida.');
      }
      if (parts.length === 2) {
        const prefix = Number(parts[1]);
        const maxPrefix = isIpv4 ? 32 : 128;
        if (!/^\d+$/.test(parts[1]) || prefix < 0 || prefix > maxPrefix) {
          throw new Error(`El rango CIDR debe estar entre 0 y ${maxPrefix}.`);
        }
      }
      return normalized;
    }

    function isValidIpv6(value) {
      if (value.includes(':::') || (value.match(/::/g) || []).length > 1) return false;
      let normalized = value;
      if (normalized.includes('.')) {
        const lastColon = normalized.lastIndexOf(':');
        if (lastColon < 0) return false;
        const octets = normalized.slice(lastColon + 1).split('.');
        if (octets.length !== 4 || !octets.every(part => /^\d{1,3}$/.test(part) && Number(part) <= 255)) return false;
        const firstGroup = ((Number(octets[0]) << 8) | Number(octets[1])).toString(16);
        const secondGroup = ((Number(octets[2]) << 8) | Number(octets[3])).toString(16);
        normalized = `${normalized.slice(0, lastColon)}:${firstGroup}:${secondGroup}`;
      }
      const groups = normalized.split(':');
      if (normalized.includes('::')) {
        const presentGroups = groups.filter(Boolean);
        return presentGroups.length < 8 && presentGroups.every(group => /^[\da-f]{1,4}$/.test(group));
      }
      return groups.length === 8 && groups.every(group => /^[\da-f]{1,4}$/.test(group));
    }

    function ipv4ToBigInt(value) {
      return value.split('.').reduce((result, part) => (result << 8n) | BigInt(part), 0n);
    }

    function ipv6ToBigInt(value) {
      let normalized = value;
      if (normalized.includes('.')) {
        const lastColon = normalized.lastIndexOf(':');
        const octets = normalized.slice(lastColon + 1).split('.').map(Number);
        normalized = `${normalized.slice(0, lastColon)}:${((octets[0] << 8) | octets[1]).toString(16)}:${((octets[2] << 8) | octets[3]).toString(16)}`;
      }
      const [left = '', right = ''] = normalized.split('::');
      const leftGroups = left ? left.split(':') : [];
      const rightGroups = right ? right.split(':') : [];
      const groups = normalized.includes('::')
        ? [...leftGroups, ...Array(8 - leftGroups.length - rightGroups.length).fill('0'), ...rightGroups]
        : leftGroups;
      return groups.reduce((result, group) => (result << 16n) | BigInt(`0x${group || '0'}`), 0n);
    }

    function ipMatchesRule(addressValue, ruleValue) {
      try {
        const address = validateIpAddress(addressValue, false);
        const rule = validateIpAddress(ruleValue);
        const [ruleAddress, prefixText] = rule.split('/');
        if (address.includes(':') !== ruleAddress.includes(':')) return false;
        const isIpv4 = !address.includes(':');
        const addressBits = isIpv4 ? 32n : 128n;
        const addressValueBigInt = isIpv4 ? ipv4ToBigInt(address) : ipv6ToBigInt(address);
        const ruleValueBigInt = isIpv4 ? ipv4ToBigInt(ruleAddress) : ipv6ToBigInt(ruleAddress);
        const prefix = BigInt(prefixText === undefined ? Number(addressBits) : Number(prefixText));
        const shift = addressBits - prefix;
        return shift === 0n ? addressValueBigInt === ruleValueBigInt : (addressValueBigInt >> shift) === (ruleValueBigInt >> shift);
      } catch {
        return false;
      }
    }

                </div></td>
              </tr>`;
            }).join('')}
          </tbody></table><div class="ip-record-count">${rules.length} ${rules.length === 1 ? 'regla registrada' : 'reglas registradas'} · Los usuarios se identifican por coincidencia de IP en los accesos guardados.</div>` : '<div class="empty">No hay reglas de control. Agrega una IP arriba para crear la primera.</div>';
          rulesContainer.querySelectorAll('[data-ip-rule-toggle]').forEach(button => {

              </div></td>
            </tr>`;

        </tbody></table><div class="ip-record-count">${logs.length} ${logs.length === 1 ? 'registro de acceso' : 'registros de acceso'}</div>` : '<div class="empty">No hay accesos guardados en ips_usuarios. Puedes registrar una IP con el botón de arriba.</div>';
        if (logsContainer) {
          logsContainer.querySelectorAll('[data-block-log-ip]').forEach(button => {
            button.addEventListener('click', () => blockLoggedIp(button));
          });
          logsContainer.querySelectorAll('[data-user-ip-edit]').forEach(button => {
            button.addEventListener('click', () => openUserIpModal(button.dataset.userIpEdit));
          });

            button.addEventListener('click', () => deleteUserIp(button));
          });

      } catch (error) {
        console.error('Error cargando control IP:', error);
        if (rulesContainer) rulesContainer.innerHTML = `<div class="empty">No se pudieron cargar reglas: ${escapeHtml(error.message || 'Error desconocido')}</div>`;
        if (logsContainer) logsContainer.innerHTML = `<div class="empty">No se pudieron cargar los accesos: ${escapeHtml(error.message || 'Error desconocido')}</div>`;
        toast(`Error al cargar datos de IP: ${error.message || 'Error desconocido'}`, 'error');
      }
    }

    async function saveIpRule(event) {
      event.preventDefault();
      const ruleForm = event.currentTarget;
      const submit = ruleForm.querySelector('button[type="submit"]');
      submit.disabled = true;
      try {
        const address = validateIpAddress(document.getElementById('ipRuleAddress').value);
        const type = document.getElementById('ipRuleAction').value;
        const reason = document.getElementById('ipRuleReason').value.trim();
        if (!address || !['blanca', 'negra', 'esekaus'].includes(type)) throw new Error('Completa una IP/CIDR y selecciona una lista válida.');
        const { data: duplicates, error: duplicateError } = await db.from('ips_control')
          .select('id').eq('ip', address).eq('tipo', type).limit(1);
        if (duplicateError) throw duplicateError;
        if (duplicates?.length) throw new Error('Ya existe una regla para esa IP y lista. Edítala desde la tabla.');
        const { data, error } = await db.from('ips_control').insert([{
          ip: address,
          tipo: type,
          motivo: reason || null,
          activo: true
        }]).select('id').single();
        if (error) throw error;
        if (!data) throw new Error('No se confirmó la creación de la regla.');
        ruleForm.reset();
        toast('Regla de IP creada correctamente.', 'success');
        await loadIpData();
      } catch (error) {
        console.error('Error guardando regla IP:', error);
        toast(`No se pudo guardar la regla: ${error.message || 'Error desconocido'}`, 'error');
      } finally {
        submit.disabled = false;
      }
    }

          .eq('id', button.dataset.ipRuleToggle).select('id').maybeSingle();
        if (error) throw error;
        if (!data) throw new Error('La regla ya no existe o no se pudo actualizar.');
        await loadIpData();

        console.error('Error actualizando regla IP:', error);
        toast(`No se pudo actualizar la regla: ${error.message || 'Error desconocido'}`, 'error');
        button.disabled = false;

    }

    function dateTimeLocal(value) {
      if (!value) return '';
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return '';
      const local = new Date(parsed.getTime() - parsed.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 16);
    }

          }).eq('id', existing[0].id).select('id').maybeSingle();
          error = updateError;

          }]).select('id').single();
          error = insertError;
          if (!error && !data) throw new Error('No se confirmó la creación de la regla negra.');

      if (storesContainer) storesContainer.innerHTML = '<div class="empty">Cargando tiendas aprobadas...</div>';
      try {
        const [
          { data: applications, error: applicationsError },
          categoriesResult,
          { data: stores, error: storesError }
        ] = await Promise.all([
          db.from('association_applications').select('*').order('created_at', { ascending: false }).limit(200),
          container
            ? db.from('product_categories').select('id, name').eq('is_active', true).order('sort_order').order('name')
            : Promise.resolve({ data: [], error: null }),
          db.from('seller_stores').select('id, owner_user_id, name, status')
        ]);
        if (applicationsError) throw applicationsError;
        if (categoriesResult.error) throw categoriesResult.error;
        if (storesError) throw storesError;
        state.associations = applications || [];
        state.categories = categoriesResult.data || [];
        const requestApplications = state.associations.filter(application =>
          ['pending', 'under_review'].includes(application.status)
        );
        const approvedApplications = state.associations.filter(application => application.status === 'approved');
        const relevantApplications = container ? requestApplications : approvedApplications;
        const relevantUserIds = relevantApplications.map(application => application.user_id);
        const userIds = [...new Set([
          ...relevantUserIds,
          ...(stores || []).filter(store => !storesContainer || relevantUserIds.includes(store.owner_user_id))
            .map(store => store.owner_user_id)
        ].filter(Boolean))];
        let profiles = [];
        if (userIds.length) {
          const { data, error } = await db.from('user_profiles').select('id, full_name, phone').in('id', userIds);
          if (error) throw error;
          profiles = data || [];
        }
        const profileById = new Map((profiles || []).map(profile => [profile.id, profile]));
        const storeByOwner = new Map((stores || []).map(store => [store.owner_user_id, store]));
        const categoryOptions = state.categories.map(category =>
          `<option value="${escapeHtml(category.id)}">${escapeHtml(category.name)}</option>`
        ).join('');
        const statusNames = { pending: 'Pendiente', under_review: 'En revisión' };
        if (container) container.innerHTML = requestApplications.length ? `<table>
          <thead><tr><th>Solicitante</th><th>Contacto</th><th>Documento</th><th>Nombre de tienda</th><th>Categoría</th><th>Estado</th><th>Recibida</th><th>Acciones</th></tr></thead>
          <tbody>${requestApplications.map(application => {
          const profile = profileById.get(application.user_id) || {};
          const store = storeByOwner.get(application.user_id);
          return `<tr data-association-row>
            <td><strong>${escapeHtml(application.full_name || 'Sin nombre')}</strong><div class="mono">${escapeHtml(application.age ? `${application.age} años` : 'Solicitud de asociado')}</div></td>
            <td>${escapeHtml(application.phone || profile.phone || '—')}<div class="mono">${escapeHtml(application.backup_phone || '')}</div></td>
            <td>${escapeHtml(application.national_id || '—')}<div class="mono">${application.nit ? `NIT ${escapeHtml(application.nit)}` : ''}</div></td>
            <td><input class="search" type="text" data-association-store-name value="${escapeHtml(store?.name || application.full_name || '')}" maxlength="120" placeholder="Nombre de tienda"></td>
            <td><select class="search" data-association-category><option value="">Selecciona</option>${categoryOptions}</select></td>
            <td><span class="pill ${application.status === 'under_review' ? 'status-review' : 'pending'}">${escapeHtml(statusNames[application.status])}</span></td>
            <td>${escapeHtml(date(application.created_at))}</td>
            <td><div class="association-actions">
              <button type="button" class="btn primary" data-association-action="approve" data-application-id="${escapeHtml(application.id)}">Aprobar y crear tienda</button>
              <button type="button" class="btn" data-association-action="review" data-application-id="${escapeHtml(application.id)}">Marcar en revisión</button>
              <button type="button" class="btn" data-association-action="reject" data-application-id="${escapeHtml(application.id)}">Rechazar</button>
              <button type="button" class="btn danger" data-association-action="delete" data-application-id="${escapeHtml(application.id)}">Eliminar</button>
            </div></td>
          </tr>`;
        }).join('')}</tbody></table>` : '<div class="empty">No hay solicitudes pendientes o en revisión.</div>';

        if (storesContainer) storesContainer.innerHTML = approvedApplications.length ? approvedApplications.map(application => {
          const profile = profileById.get(application.user_id) || {};
          const store = storeByOwner.get(application.user_id);
          const storeName = store?.name || 'Tienda aprobada';
          const ownerName = profile.full_name || application.full_name || 'Dueña sin nombre';
          const initials = storeName.trim().split(/\s+/).slice(0, 2).map(word => word[0]).join('').toUpperCase() || 'T';
          const storeStatus = store?.status || 'sin tienda';
          const statusLabel = storeStatus === 'active' ? 'Tienda activa' : storeStatus === 'suspended' ? 'Tienda suspendida' : storeStatus;
          return `<article class="store-card">
            <div class="store-card-head">
              <div class="store-avatar" aria-hidden="true">${escapeHtml(initials)}</div>
              <div class="store-card-copy">
                <h3>${escapeHtml(storeName)}</h3>
                <p>Asociada desde ${escapeHtml(date(application.reviewed_at || application.created_at))}</p>

              <span class="pill ${storeStatus === 'active' ? 'completed' : 'pending'}">${escapeHtml(statusLabel)}</span>
            </div>
            <div class="store-owner">
              <div class="store-owner-icon" aria-hidden="true">D</div>

              <button type="button" class="btn" data-association-action="edit" data-application-id="${escapeHtml(application.id)}">Editar tienda y dueña</button>

      }
    }

    function makeSellerAccessCode() {
      const random = new Uint32Array(1);
      crypto.getRandomValues(random);
      return String(100000 + (random[0] % 900000));
    }

    async function hashAccessCode(code) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(code));
      return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
    }

    async function issueSellerAccessCode(storeId, phone, replaceExisting = false) {
      const { data: existingCodes, error: lookupError } = await db.from('seller_access_codes')
        .select('id').eq('store_id', storeId).is('revoked_at', null)
        .order('created_at', { ascending: false }).limit(1);
      if (lookupError) throw lookupError;
      if (existingCodes?.length && !replaceExisting) {
        const { error } = await db.from('seller_access_codes')
          .update({ expires_at: '9999-12-31T23:59:59.999Z' }).eq('id', existingCodes[0].id);
        if (error) throw error;
        const { error: revokeError } = await db.from('seller_access_codes')
          .update({ revoked_at: new Date().toISOString() })
          .eq('store_id', storeId).is('revoked_at', null).neq('id', existingCodes[0].id);
        if (revokeError) throw revokeError;
        return;
      }

      const code = makeSellerAccessCode();
      const codeHash = await hashAccessCode(code);
      const { data: createdCode, error } = await db.from('seller_access_codes').insert({
        store_id: storeId,
        code_hash: codeHash,
        expires_at: '9999-12-31T23:59:59.999Z'
      }).select('id').single();
      if (error) throw error;
      if (existingCodes?.length) {
        const { error: revokeError } = await db.from('seller_access_codes')
          .update({ revoked_at: new Date().toISOString() })
          .eq('store_id', storeId).is('revoked_at', null).neq('id', createdCode.id);
        if (revokeError) throw revokeError;
      }
      window.prompt(`Envía manualmente este código permanente por WhatsApp a ${phone}. Si lo pierden, genera uno nuevo desde aquí:`, code);
    }

    async function handleAssociationAction(button) {
      button.disabled = true;
      try {
        const application = state.associations.find(item => item.id === button.dataset.applicationId);
        if (!application) throw new Error('No se encontró la solicitud.');
        const action = button.dataset.associationAction;

        if (action === 'review' || action === 'reject') {
          const { error } = await db.from('association_applications').update({
            status: action === 'review' ? 'under_review' : 'rejected',
            reviewed_at: new Date().toISOString()
          }).eq('id', application.id);
          if (error) throw error;
        } else if (action === 'approve') {
          const requestRow = button.closest('[data-association-row]');
          const storeName = requestRow.querySelector('[data-association-store-name]').value.trim();
          const categoryId = requestRow.querySelector('[data-association-category]').value;
          if (!storeName || !categoryId) throw new Error('Escribe el nombre de la tienda y selecciona una categoría.');

          let { data: store, error: storeError } = await db.from('seller_stores')
            .select('id, status').eq('owner_user_id', application.user_id).maybeSingle();
          if (storeError) throw storeError;
          if (!store) {
            const slugBase = storeName.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            const { data, error } = await db.from('seller_stores').insert({
              application_id: application.id,
              owner_user_id: application.user_id,
              name: storeName,
              slug: `${slugBase || 'tienda'}-${application.user_id.slice(0, 8)}`,
              status: 'active'
            }).select('id, status').single();
            if (error) throw error;
            store = data;
          } else if (store.status !== 'active') {
            const { error } = await db.from('seller_stores').update({ status: 'active' }).eq('id', store.id);
            if (error) throw error;
          }

          const { error: categoryError } = await db.from('seller_store_categories').upsert({
            store_id: store.id, category_id: categoryId
          }, { onConflict: 'store_id,category_id' });
          if (categoryError) throw categoryError;
          const { error: statusError } = await db.from('association_applications').update({
            status: 'approved',
            reviewed_at: new Date().toISOString()
          }).eq('id', application.id);
          if (statusError) throw statusError;
          await issueSellerAccessCode(store.id, application.phone);
        } else if (action === 'code') {
          const { data: store, error } = await db.from('seller_stores')
            .select('id').eq('owner_user_id', application.user_id).eq('status', 'active').single();
          if (error) throw error;
          await issueSellerAccessCode(store.id, application.phone, true);
        } else if (action === 'edit') {
          const { data: store, error: storeError } = await db.from('seller_stores')
            .select('id, name').eq('owner_user_id', application.user_id).maybeSingle();
          if (storeError) throw storeError;
          const newName = window.prompt('Nombre completo del asociado:', application.full_name);
          if (newName === null) return;
          const newPhone = window.prompt('Número de celular:', application.phone);
          if (newPhone === null) return;
          const newStoreName = store
            ? window.prompt('Nombre de la tienda:', store.name)
            : null;
          if (store && newStoreName === null) return;
          if (!newName.trim() || !newPhone.trim() || (store && !newStoreName.trim())) {
            throw new Error('El nombre y el celular no pueden quedar vacíos.');
          }
          const { error: applicationUpdateError } = await db.from('association_applications')
            .update({ full_name: newName.trim(), phone: newPhone.trim() }).eq('id', application.id);
          if (applicationUpdateError) throw applicationUpdateError;
          if (store) {
            const { error: storeUpdateError } = await db.from('seller_stores')
              .update({ name: newStoreName.trim() }).eq('id', store.id);
            if (storeUpdateError) throw storeUpdateError;
          }
        } else if (action === 'reactivate') {
          const { data: store, error: storeError } = await db.from('seller_stores')
            .select('id').eq('owner_user_id', application.user_id).maybeSingle();
          if (storeError) throw storeError;
          if (!store) throw new Error('No se encontró la tienda de este asociado.');
          const { error: statusError } = await db.from('seller_stores')
            .update({ status: 'active' }).eq('id', store.id);
          if (statusError) throw statusError;
        } else if (action === 'delete') {
          const isApproved = application.status === 'approved';
          let store = null;
          if (isApproved) {
            const { data, error: storeError } = await db.from('seller_stores')
              .select('id').eq('owner_user_id', application.user_id).maybeSingle();
            if (storeError) throw storeError;
            store = data;
          }
          const confirmation = window.confirm(isApproved
            ? `¿Eliminar definitivamente a ${application.full_name} como asociado? Se borrarán todas sus solicitudes, tienda, productos, puntos propios, códigos de acceso e historial de accesos de esa tienda. Esta acción no se puede deshacer. La cuenta general del usuario se conservará.`
            : `¿Eliminar únicamente la solicitud de ${application.full_name}? La cuenta general del usuario se conservará.`);
          if (!confirmation) return;

          if (isApproved && store) {
            const { error: productsError } = await db.from('products').delete().eq('store_id', store.id);
            if (productsError) throw productsError;
            const { error: logsError } = await db.from('user_ip_access_logs').delete().eq('store_id', store.id);
            if (logsError) throw logsError;
            const { error: storeDeleteError } = await db.from('seller_stores').delete().eq('id', store.id);
            if (storeDeleteError) throw storeDeleteError;
          }

          const { error: applicationsError } = await db.from('association_applications')
            .delete()
            .eq(isApproved ? 'user_id' : 'id', isApproved ? application.user_id : application.id);
          if (applicationsError) throw applicationsError;
        }
        toast(action === 'delete'
          ? application.status === 'approved' ? 'Asociado eliminado definitivamente.' : 'Solicitud eliminada.'
          : 'Cambios guardados correctamente.', 'success');
        await loadAssociations();
      } catch (error) {
        console.error('Error administrando solicitud de asociado:', error);
        toast(`No se pudo completar la acción: ${error.message || 'Error desconocido'}`, 'error');
        button.disabled = false;
      } finally {
        button.disabled = false;
      }
    }

    function monthlyVolumeChart(transactions) {
      const now = new Date();
      const months = Array.from({ length: 6 }, (_, index) => {
        const monthDate = new Date(now.getFullYear(), now.getMonth() - 5 + index, 1);
        return {
          year: monthDate.getFullYear(),
          month: monthDate.getMonth(),
          label: monthDate.toLocaleDateString('es-BO', { month: 'short' }).replace('.', ''),
          value: 0
        };
      });
      for (const transaction of transactions) {
        const dateValue = new Date(transaction.created_at);
        if (Number.isNaN(dateValue.getTime())) continue;
        const bucket = months.find(month => month.year === dateValue.getFullYear() && month.month === dateValue.getMonth());
        const amount = Number(transaction.amount);
        if (bucket && Number.isFinite(amount)) bucket.value += Math.abs(amount);
      }

      const chart = { x: 58, y: 18, width: 620, height: 174 };
      const maximum = Math.max(...months.map(month => month.value), 1);
      const rawStep = maximum / 4;
      const magnitude = 10 ** Math.floor(Math.log10(rawStep));
      const normalizedStep = rawStep / magnitude;
      const niceStep = (normalizedStep <= 1 ? 1 : normalizedStep <= 2 ? 2 : normalizedStep <= 5 ? 5 : 10) * magnitude;
      const scaleMaximum = niceStep * 4;
      const step = niceStep;
      const slot = chart.width / months.length;
      const formatAxis = value => value >= 1000 ? `${(value / 1000).toFixed(value >= 10000 ? 0 : 1)}k` : String(Math.round(value));
      const grid = Array.from({ length: 5 }, (_, index) => {
        const y = chart.y + chart.height - (chart.height * index / 4);
        const value = step * index;
        return `<line class="chart-gridline" x1="${chart.x}" y1="${y}" x2="${chart.x + chart.width}" y2="${y}"></line><text x="${chart.x - 9}" y="${y + 3}" text-anchor="end">${escapeHtml(formatAxis(value))}</text>`;
      }).join('');
      const bars = months.map((month, index) => {
        const barWidth = 42;
        const height = month.value ? Math.max(3, chart.height * month.value / scaleMaximum) : 2;
        const x = chart.x + slot * index + (slot - barWidth) / 2;
        const y = chart.y + chart.height - height;
        const current = index === months.length - 1;
        return `<rect class="chart-bar${current ? ' chart-bar-current' : ''}" x="${x}" y="${y}" width="${barWidth}" height="${height}" rx="6"></rect>
          <text x="${x + barWidth / 2}" y="${Math.max(12, y - 7)}" text-anchor="middle">${escapeHtml(formatAxis(month.value))}</text>
          <text x="${x + barWidth / 2}" y="${chart.y + chart.height + 23}" text-anchor="middle">${escapeHtml(month.label)}</text>`;
      }).join('');
      return `<svg class="monthly-chart" viewBox="0 0 710 235" role="img" aria-label="Gráfico de volumen mensual en bolivianos">${grid}${bars}</svg>
        <p class="inline-note">Importes expresados en bolivianos (Bs). Se consideran únicamente transacciones completadas.</p>`;
    }

    function donutChart(items, caption) {
      const total = items.reduce((sum, item) => sum + item.value, 0);
      const circumference = 2 * Math.PI * 40;
      let offset = 0;
      const segments = items.filter(item => item.value > 0).map(item => {
        const length = circumference * item.value / total;
        const segment = `<circle class="donut-segment" cx="60" cy="60" r="40" stroke="${item.color}" stroke-dasharray="${length} ${circumference - length}" stroke-dashoffset="${-offset}"></circle>`;
        offset += length;
        return segment;
      }).join('');
      const legend = items.map(item => `<div class="chart-legend-item">
        <span class="chart-legend-dot" style="background:${item.color}"></span>
        <span>${escapeHtml(item.label)}</span><strong>${item.value}</strong>
      </div>`).join('');
      return `<div class="donut-layout">
        <svg class="donut-chart" viewBox="0 0 120 120" role="img" aria-label="${escapeHtml(caption)}: ${total} registros">
          <circle class="donut-track" cx="60" cy="60" r="40"></circle>${segments}
          <text class="donut-total" x="60" y="57">${total}</text><text class="donut-caption" x="60" y="72">${escapeHtml(caption)}</text>
        </svg><div class="chart-legend">${legend}</div>
      </div>`;
    }

    function transactionTable(rows) {
      if (!rows.length) return '<div class="empty">No hay transacciones registradas.</div>';
      return `<table><thead><tr><th>Fecha</th><th>Usuario</th><th>Tipo</th><th>Monto</th><th>Estado</th><th>Descripción</th></tr></thead><tbody>${rows.map(item => `

        <td>${statusPill(item.status)}</td><td>${escapeHtml(item.description || '—')}</td></tr>`).join('')}</tbody></table>`;
    }

          <tr><td>${escapeHtml(date(item.created_at))}</td><td>${shortId(item.id)}</td><td>${escapeHtml(userName(item.user_id))}</td><td><span class="pill type">${escapeHtml(typeLabel(item.type))}</span></td><td>${escapeHtml(money(item.amount))}</td><td>${statusPill(item.status)}</td><td>${escapeHtml(item.description || '—')}</td><td><div class="table-actions"><button class="table-btn" data-edit-transaction="${escapeHtml(item.id)}" title="Editar transacción" aria-label="Editar transacción">✎</button><button class="table-btn danger" data-delete-transaction="${escapeHtml(item.id)}" title="Eliminar transacción" aria-label="Eliminar transacción">×</button></div></td></tr>`).join('')}</tbody></table>` : '<div class="empty">No hay transacciones.</div>'}</div></section>
