    const CATALOG_CONFIG = {
      products: {
        table: 'products',
        label: 'Productos',
        singular: 'producto',
        columns: [
          { key: 'name', label: 'Nombre', type: 'text', required: true, full: true },
          { key: 'description', label: 'Descripción', type: 'textarea', full: true },
          { key: 'price', label: 'Precio (Bs)', type: 'number', required: true, min: '0', step: '0.01' },
          { key: 'stock', label: 'Stock', type: 'number', required: true, min: '0', step: '1' },
          { key: 'category', label: 'Categoría', type: 'text', required: true },
          { key: 'discount_percentage', label: 'Descuento (%)', type: 'number', min: '0', max: '100', step: '1' },
          { key: 'image_url', label: 'URL de imagen', type: 'url', full: true },
          { key: 'is_active', label: 'Producto activo', type: 'checkbox' },
          { key: 'is_featured', label: 'Producto destacado', type: 'checkbox' }
        ]
      },
      locations: {
        table: 'pickup_locations',
        label: 'Lugares de recogida',
        singular: 'lugar de recogida',
        columns: [
          { key: 'name', label: 'Nombre del lugar', type: 'text', required: true },
          { key: 'address', label: 'Dirección', type: 'text', required: true, full: true },
          { key: 'latitude', label: 'Latitud', type: 'number', min: '-90', max: '90', step: '0.000001' },
          { key: 'longitude', label: 'Longitud', type: 'number', min: '-180', max: '180', step: '0.000001' },
          { key: 'schedule', label: 'Horario', type: 'text', full: true },
          { key: 'is_active', label: 'Lugar activo', type: 'checkbox' }
        ]
      }
    };

    function catalogFields(config, item) {
      return config.columns.map(column => {
        const defaultValue = column.key === 'category' ? 'General' : '';
        const value = item ? item[column.key] : defaultValue;
        const full = column.full ? ' full' : '';
        if (column.type === 'checkbox') {
          const checked = value === undefined ? column.key === 'is_active' : Boolean(value);
          return `<label class="field checkbox-field${full}"><input type="checkbox" name="${column.key}" ${checked ? 'checked' : ''}><span>${column.label}</span></label>`;
        }
        const required = column.required ? 'required' : '';
        const min = column.min !== undefined ? `min="${column.min}"` : '';
        const max = column.max !== undefined ? `max="${column.max}"` : '';
        const step = column.step ? `step="${column.step}"` : '';
        if (column.type === 'textarea') {
          return `<div class="field${full}"><label for="${column.key}">${column.label}</label><textarea id="${column.key}" name="${column.key}" ${required}>${escapeHtml(value || '')}</textarea></div>`;
        }
        return `<div class="field${full}"><label for="${column.key}">${column.label}</label><input id="${column.key}" name="${column.key}" type="${column.type}" value="${escapeHtml(value ?? '')}" ${required} ${min} ${max} ${step}></div>`;
      }).join('');
    }

    function catalogRows(kind, items) {
      if (kind === 'products') {
        return items.map(item => `<tr>
          <td><strong>${escapeHtml(item.name)}</strong><div class="mono">${shortId(item.id)}</div></td>
          <td>${escapeHtml(item.category)}</td>
          <td>${escapeHtml(money(item.price))}</td>
          <td>${escapeHtml(item.stock)}</td>
          <td>${escapeHtml(item.discount_percentage || 0)}%</td>
          <td>${item.is_featured ? '<span class="pill type">Destacado</span>' : '—'}</td>
          <td>${item.is_active ? '<span class="pill completed">Activo</span>' : '<span class="pill failed">Inactivo</span>'}</td>
          <td>${escapeHtml(date(item.created_at))}</td>
          <td><div class="table-actions"><button class="table-btn" data-edit-catalog="${escapeHtml(item.id)}" title="Editar producto" aria-label="Editar producto">✎</button><button class="table-btn danger" data-delete-catalog="${escapeHtml(item.id)}" title="Eliminar producto" aria-label="Eliminar producto">×</button></div></td>
        </tr>`).join('');
      }
      return items.map(item => `<tr>
        <td><strong>${escapeHtml(item.name)}</strong><div class="mono">${shortId(item.id)}</div></td>
        <td>${escapeHtml(item.address)}</td>
        <td>${escapeHtml(item.latitude ?? '—')}, ${escapeHtml(item.longitude ?? '—')}</td>
        <td>${escapeHtml(item.schedule || '—')}</td>
        <td>${item.is_active ? '<span class="pill completed">Activo</span>' : '<span class="pill failed">Inactivo</span>'}</td>
        <td>${escapeHtml(date(item.created_at))}</td>
        <td><div class="table-actions"><button class="table-btn" data-edit-catalog="${escapeHtml(item.id)}" title="Editar lugar" aria-label="Editar lugar">✎</button><button class="table-btn danger" data-delete-catalog="${escapeHtml(item.id)}" title="Eliminar lugar" aria-label="Eliminar lugar">×</button></div></td>
      </tr>`).join('');
    }

    function renderCatalog(kind) {
      const config = CATALOG_CONFIG[kind];
      const items = state[kind].filter(item => {
        const searchable = Object.values(item).filter(value => value !== null && value !== undefined).join(' ').toLowerCase();
        return searchable.includes(state.search.toLowerCase());
      });
      const headers = kind === 'products'
        ? '<th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Descuento</th><th>Promoción</th><th>Estado</th><th>Creado</th><th>Acciones</th>'
        : '<th>Lugar</th><th>Dirección</th><th>Coordenadas</th><th>Horario</th><th>Estado</th><th>Creado</th><th>Acciones</th>';
      const addButton = `<button class="btn primary" id="newCatalogItem">Nuevo ${config.singular}</button>`;
      content.innerHTML = `${pageHeader(config.label, `Administra registros de la tabla ${config.table}.`, `${exportButtons()}${addButton}`)}
        <section class="panel"><div class="panel-head"><h3>${items.length} registros</h3><input class="search" id="searchInput" type="search" placeholder="Buscar..."></div>
          <div class="table-wrap">${items.length ? `<table><thead><tr>${headers}</tr></thead><tbody>${catalogRows(kind, items)}</tbody></table>` : `<div class="empty">No hay ${config.label.toLowerCase()} registrados.</div>`}</div>
        </section>`;
      bindRefresh();
      bindExports(kind);
      document.getElementById('newCatalogItem').addEventListener('click', () => openCatalogModal(kind));
      document.getElementById('searchInput').value = state.search;
      document.getElementById('searchInput').addEventListener('input', event => {
        const position = event.target.selectionStart;
        state.search = event.target.value;
        renderCatalog(kind);
        const input = document.getElementById('searchInput');
        input.focus();
        input.setSelectionRange(position, position);
      });
      content.querySelectorAll('[data-edit-catalog]').forEach(button => button.addEventListener('click', () => openCatalogModal(kind, button.dataset.editCatalog)));
      content.querySelectorAll('[data-delete-catalog]').forEach(button => button.addEventListener('click', () => deleteCatalogItem(kind, button.dataset.deleteCatalog)));
    }

    function openCatalogModal(kind, itemId = null) {
      const config = CATALOG_CONFIG[kind];
      const item = itemId ? state[kind].find(record => record.id === itemId) : null;
      if (itemId && !item) return toast(`No se encontró ${config.singular}.`, 'error');
      editingUserId = null;
      editingTransactionId = null;
      editingIpRecord = null;
      editingCatalog = { kind, id: item?.id || null };
      locationDetailsStep = false;
      if (kind === 'locations') {
        locationDraft = item
          ? { ...item, latitude: item.latitude, longitude: item.longitude, address: item.address || '' }
          : { latitude: null, longitude: null, address: '' };
        document.querySelector('.modal').classList.add('map-modal');
        renderLocationMapStep(Boolean(item));
      } else {
        document.querySelector('.modal').classList.remove('map-modal');
        document.getElementById('modalTitle').textContent = item ? `Editar ${config.singular}` : `Nuevo ${config.singular}`;
        document.getElementById('modalSubmit').textContent = item ? 'Guardar cambios' : 'Crear registro';
        document.getElementById('modalBack').hidden = true;
        document.getElementById('modalBody').innerHTML = catalogFields(config, item);
      }
      backdrop.classList.add('show');
      if (kind === 'locations') window.setTimeout(() => initializePickupMap(Boolean(item)), 80);
    }

    function renderLocationMapStep(hasExistingLocation) {
      locationDetailsStep = false;
      document.getElementById('modalTitle').textContent = hasExistingLocation ? 'Editar ubicación · 1 de 2' : 'Nuevo lugar · 1 de 2';
      document.getElementById('modalSubmit').textContent = 'Siguiente';
      document.getElementById('modalSubmit').disabled = !hasLocationCoordinates(locationDraft) || !locationDraft.address;
      document.getElementById('modalBack').hidden = true;
      document.getElementById('modalBody').innerHTML = `
        <div class="map-step">
          <p>Busca una dirección, usa tu ubicación actual o haz clic directamente en el mapa para marcar el punto.</p>
          <div class="map-tools">
            <div class="map-search" role="search">
              <input id="mapSearchInput" type="search" placeholder="Buscar ciudad, calle o lugar..." autocomplete="off" aria-label="Buscar un lugar en el mapa">
              <button class="btn" type="button" id="mapSearchButton">Buscar</button>
            </div>
            <button class="btn" type="button" id="myLocationButton">Mi ubicación</button>
          </div>
          <div id="mapResults" class="map-results" aria-live="polite"></div>
          <div id="pickupMap" role="application" aria-label="Mapa OpenStreetMap. Haz clic para marcar un lugar de recogida."></div>
          <div id="mapSelection" class="map-selection">${hasExistingLocation ? 'Ubicación actual cargada. Haz clic en el mapa para cambiarla.' : 'Aún no seleccionaste una ubicación.'}</div>
          <p>Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>. La dirección se consulta con Nominatim. Para usar tu ubicación, permite el acceso del navegador; normalmente requiere HTTPS o localhost.</p>
        </div>`;
    }

    function hasLocationCoordinates(location) {
      return location.latitude !== null && location.latitude !== undefined && location.longitude !== null && location.longitude !== undefined
        && Number.isFinite(Number(location.latitude)) && Number.isFinite(Number(location.longitude));
    }

    function initializePickupMap(hasExistingLocation) {
      if (!document.getElementById('pickupMap') || !window.L) {
        toast('No se pudo cargar el mapa. Comprueba tu conexión e inténtalo de nuevo.', 'error');
        return;
      }
      if (pickupMap) {
        pickupMap.remove();
        pickupMap = null;
        pickupMarker = null;
        currentLocationMarker = null;
      }
      const hasCoordinates = hasLocationCoordinates(locationDraft);
      const center = hasCoordinates
        ? [Number(locationDraft.latitude), Number(locationDraft.longitude)]
        : [-16.5000, -68.1500];
      pickupMap = window.L.map('pickupMap').setView(center, hasCoordinates ? 16 : 13);
      window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(pickupMap);
      if (hasCoordinates) {
        pickupMarker = window.L.marker(center).addTo(pickupMap);
      }
      document.getElementById('mapSearchButton').addEventListener('click', searchMapPlace);
      document.getElementById('mapSearchInput').addEventListener('keydown', event => {
        if (event.key === 'Enter') searchMapPlace(event);
      });
      document.getElementById('myLocationButton').addEventListener('click', showCurrentLocation);
      pickupMap.on('click', event => selectPickupPoint(event.latlng));
      window.setTimeout(() => pickupMap?.invalidateSize(), 100);
      if (!hasExistingLocation && hasCoordinates) updateMapSelection(`Ubicación seleccionada: ${Number(locationDraft.latitude).toFixed(6)}, ${Number(locationDraft.longitude).toFixed(6)}`);
    }

    function updateMapSelection(message) {
      const status = document.getElementById('mapSelection');
      if (status) status.textContent = message;
    }

    function selectPickupPoint(latlng, knownAddress = '') {
      locationDraft.latitude = Number(latlng.lat.toFixed(6));
      locationDraft.longitude = Number(latlng.lng.toFixed(6));
      if (pickupMarker) pickupMarker.setLatLng(latlng);
      else pickupMarker = window.L.marker(latlng).addTo(pickupMap);
      const requestId = ++geocodeRequestId;
      if (geocodeTimeout) window.clearTimeout(geocodeTimeout);
      if (geocodeController) geocodeController.abort();
      if (knownAddress) {
        locationDraft.address = knownAddress;
        updateMapSelection(`Ubicación: ${locationDraft.latitude.toFixed(6)}, ${locationDraft.longitude.toFixed(6)} · ${locationDraft.address}`);
        document.getElementById('modalSubmit').disabled = false;
        return;
      }
      geocodeController = new AbortController();
      const submit = document.getElementById('modalSubmit');
      submit.disabled = true;
      updateMapSelection(`Buscando dirección para ${locationDraft.latitude.toFixed(6)}, ${locationDraft.longitude.toFixed(6)}...`);
      geocodeTimeout = window.setTimeout(async () => {
        try {
          const params = new URLSearchParams({
            format: 'jsonv2',
            lat: String(locationDraft.latitude),
            lon: String(locationDraft.longitude),
            zoom: '18',
            addressdetails: '1'
          });
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?${params}`, {
            headers: { 'Accept': 'application/json', 'Accept-Language': 'es' },
            signal: geocodeController.signal
          });
          if (!response.ok) throw new Error(`Nominatim respondió con estado ${response.status}.`);
          const result = await response.json();
          if (requestId !== geocodeRequestId) return;
          if (!result.display_name) throw new Error('No se encontró una dirección para el punto seleccionado.');
          locationDraft.address = result.display_name;
          updateMapSelection(`Ubicación: ${locationDraft.latitude.toFixed(6)}, ${locationDraft.longitude.toFixed(6)} · ${locationDraft.address}`);
          submit.disabled = false;
        } catch (error) {
          if (error.name === 'AbortError' || requestId !== geocodeRequestId) return;
          console.error('Error obteniendo dirección de OpenStreetMap:', error);
          locationDraft.address = '';
          updateMapSelection(`No se pudo obtener la dirección: ${error.message || 'Error desconocido'}. Marca el punto de nuevo para reintentar.`);
          toast('No se pudo obtener la dirección. Inténtalo de nuevo en otro punto.', 'error');
          submit.disabled = true;
        }
      }, 1100);
    }

    async function searchMapPlace(event) {
      event.preventDefault();
      const query = document.getElementById('mapSearchInput').value.trim();
      const resultsContainer = document.getElementById('mapResults');
      const searchButton = document.getElementById('mapSearchButton');
      if (query.length < 3) {
        resultsContainer.textContent = 'Escribe al menos 3 caracteres para buscar.';
        return;
      }
      const requestId = ++geocodeRequestId;
      if (geocodeTimeout) window.clearTimeout(geocodeTimeout);
      if (geocodeController) geocodeController.abort();
      geocodeController = new AbortController();
      searchButton.disabled = true;
      resultsContainer.textContent = 'Buscando lugares...';
      try {
        const params = new URLSearchParams({
          format: 'jsonv2',
          q: query,
          limit: '5',
          addressdetails: '1'
        });
        const response = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, {
          headers: { 'Accept': 'application/json', 'Accept-Language': 'es' },
          signal: geocodeController.signal
        });
        if (!response.ok) throw new Error(`OpenStreetMap respondió con estado ${response.status}.`);
        const results = await response.json();
        if (requestId !== geocodeRequestId) return;
        if (!results.length) {
          resultsContainer.textContent = 'No se encontraron lugares. Prueba con otro nombre o dirección.';
          return;
        }
        resultsContainer.innerHTML = results.map((result, index) =>
          `<button type="button" class="map-result" data-map-result="${index}">${escapeHtml(result.display_name)}</button>`
        ).join('');
        resultsContainer.querySelectorAll('[data-map-result]').forEach(button => {
          button.addEventListener('click', () => {
            const result = results[Number(button.dataset.mapResult)];
            const latlng = { lat: Number(result.lat), lng: Number(result.lon) };
            if (!Number.isFinite(latlng.lat) || !Number.isFinite(latlng.lng)) {
              toast('El resultado de búsqueda no contiene coordenadas válidas.', 'error');
              return;
            }
            pickupMap.setView(latlng, 17);
            selectPickupPoint(latlng, result.display_name);
            resultsContainer.replaceChildren();
          });
        });
      } catch (error) {
        if (error.name === 'AbortError' || requestId !== geocodeRequestId) return;
        console.error('Error buscando lugar en OpenStreetMap:', error);
        resultsContainer.textContent = 'No se pudo realizar la búsqueda. Comprueba tu conexión e inténtalo de nuevo.';
        toast(`Error al buscar lugar: ${error.message || 'Error desconocido'}`, 'error');
      } finally {
        if (requestId === geocodeRequestId) searchButton.disabled = false;
      }
    }

    function showCurrentLocation() {
      if (!navigator.geolocation) {
        toast('Este navegador no permite obtener la ubicación actual.', 'error');
        return;
      }
      const requestId = ++currentLocationRequestId;
      const button = document.getElementById('myLocationButton');
      button.disabled = true;
      updateMapSelection('Solicitando permiso para usar tu ubicación...');
      navigator.geolocation.getCurrentPosition(position => {
        if (requestId !== currentLocationRequestId || !pickupMap) return;
        const latlng = {
          lat: position.coords.latitude,
          lng: position.coords.longitude
        };
        if (!Number.isFinite(latlng.lat) || !Number.isFinite(latlng.lng)) {
          button.disabled = false;
          toast('El navegador devolvió una ubicación inválida.', 'error');
          return;
        }
        pickupMap.setView(latlng, 17);
        if (currentLocationMarker) currentLocationMarker.setLatLng(latlng);
        else currentLocationMarker = window.L.circleMarker(latlng, {
          radius: 18,
          color: '#168aad',
          weight: 3,
          fillColor: '#168aad',
          fillOpacity: 0.16
        }).addTo(pickupMap);
        selectPickupPoint(latlng);
        button.disabled = false;
      }, error => {
        if (requestId !== currentLocationRequestId) return;
        button.disabled = false;
        const messages = {
          1: 'Permiso de ubicación denegado. Habilítalo en el navegador para usar esta opción.',
          2: 'No se pudo determinar tu ubicación actual.',
          3: 'La solicitud de ubicación tardó demasiado. Inténtalo de nuevo.'
        };
        toast(messages[error.code] || `No se pudo obtener la ubicación: ${error.message}`, 'error');
        updateMapSelection('Selecciona un resultado de búsqueda, usa el mapa o vuelve a intentar tu ubicación.');
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
    }

    function renderLocationDetailsStep() {
      locationDetailsStep = true;
      document.querySelector('.modal').classList.remove('map-modal');
      const item = { ...locationDraft };

    async function processTransfer(event) {
      event.preventDefault();
      const transferForm = event.currentTarget;
      const operation = transferForm.elements.operation.value;
      const userId = transferForm.elements.source_user_id.value;
      const amount = Number(transferForm.elements.amount.value);
      const description = transferForm.elements.description.value.trim();
      if (!userId || !Number.isFinite(amount) || amount <= 0) {
        toast('Selecciona un usuario e ingresa un monto mayor que cero.', 'error');
        return;
      }
      const submit = document.getElementById('transferSubmit');
      submit.disabled = true;
      try {
        const metadata = {
          source: 'giko_admin',
          created_at: new Date().toISOString(),
          ...(operation === 'transfer' ? { admin_credit: true } : {})
        };
        const { error } = await db.from('transactions').insert([{
          user_id: userId,
          amount,
          type: operation,
          status: 'completed',
          description: description || `Movimiento administrativo: ${typeLabel(operation)}`,
          metadata
        }]);
        if (error) throw error;
        toast('Movimiento registrado correctamente.', 'success');
        transferForm.reset();
        await loadData();
      } catch (error) {
        console.error('Error registrando movimiento:', error);
        toast(`No se pudo registrar el movimiento: ${error.message || 'Error desconocido'}`, 'error');
      } finally {
        submit.disabled = false;
      }
    }

    function getExportData(table) {
      if (table === 'users') {
        const balances = balancesByUser();
        return {
          name: 'usuarios-giko',
          title: 'Usuarios',
          columns: ['ID', 'Nombre completo', 'Email', 'Teléfono', 'PIN', 'Balance estimado (Bs)', 'Fecha de registro'],
          rows: state.users.map(user => [user.id, user.full_name || '', user.email || '', user.phone || '', 'Protegido (no visible; bcrypt)', Number(balances[user.id] || 0).toFixed(2), date(user.created_at)])
        };
      }
      if (table === 'products') {
        return {
          name: 'productos-giko',
          title: 'Productos',
          columns: ['ID', 'Nombre', 'Descripción', 'Precio (Bs)', 'Stock', 'Categoría', 'Imagen', 'Activo', 'Destacado', 'Descuento (%)', 'Creado', 'Actualizado'],
          rows: state.products.map(item => [item.id, item.name, item.description || '', Number(item.price).toFixed(2), item.stock, item.category, item.image_url || '', item.is_active ? 'Sí' : 'No', item.is_featured ? 'Sí' : 'No', item.discount_percentage || 0, date(item.created_at), date(item.updated_at)])
        };
      }
      if (table === 'locations') {
        return {
          name: 'lugares-recogida-giko',
          title: 'Lugares de recogida',
          columns: ['ID', 'Nombre', 'Dirección', 'Latitud', 'Longitud', 'Horario', 'Activo', 'Creado'],
          rows: state.locations.map(item => [item.id, item.name, item.address, item.latitude ?? '', item.longitude ?? '', item.schedule || '', item.is_active ? 'Sí' : 'No', date(item.created_at)])

      }
      return {
        name: 'transacciones-giko',
        title: 'Transacciones',
        columns: ['ID', 'Usuario', 'Monto (Bs)', 'Tipo', 'Estado', 'Descripción', 'Fecha', 'Metadata'],
        rows: state.transactions.map(item => [item.id, userName(item.user_id), Number(item.amount).toFixed(2), typeLabel(item.type), item.status, item.description || '', date(item.created_at), JSON.stringify(item.metadata || {})])

    function exportExcel(table) {
      if (!window.XLSX) return toast('No se pudo cargar el exportador de Excel.', 'error');
      const data = getExportData(table);
      const worksheet = XLSX.utils.aoa_to_sheet([data.columns, ...data.rows]);
      worksheet['!cols'] = data.columns.map((column, index) => ({
        wch: Math.min(42, Math.max(column.length + 3, ...data.rows.slice(0, 100).map(row => String(row[index] ?? '').length + 2)))
      }));
      worksheet['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: data.rows.length, c: data.columns.length - 1 } }) };
      worksheet['!freeze'] = { xSplit: 0, ySplit: 1 };
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, data.title.slice(0, 31));
      XLSX.writeFile(workbook, `${data.name}-${new Date().toISOString().slice(0, 10)}.xlsx`);
      toast(`${data.rows.length} registros exportados a Excel.`, 'success');
    }

    function exportPdf(table) {
      const JsPDF = window.jspdf?.jsPDF;
      if (!JsPDF) return toast('No se pudo cargar el exportador de PDF.', 'error');
      const data = getExportData(table);
      const doc = new JsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      doc.setTextColor(16, 42, 67);
      doc.setFontSize(18);
      doc.text('GIKO ADMIN', 14, 16);
      doc.setFontSize(11);
      doc.text(data.title, 14, 23);
      doc.setFontSize(8);
      doc.setTextColor(100, 116, 139);
      doc.text(`${data.rows.length} registros · ${new Date().toLocaleString('es-BO')}`, 14, 29);
      doc.autoTable({
        head: [data.columns],
        body: data.rows,
        startY: 34,
        margin: { left: 12, right: 12, bottom: 16 },
        styles: { fontSize: 7, cellPadding: 2.5, overflow: 'linebreak' },
        headStyles: { fillColor: [16, 42, 67], textColor: [255, 255, 255], fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [231, 246, 251] },
        didDrawPage: page => {
          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          doc.text(`GIKO Admin · Página ${page.pageNumber}`, 12, doc.internal.pageSize.getHeight() - 8);
        }
      });
      doc.save(`${data.name}-${new Date().toISOString().slice(0, 10)}.pdf`);
      toast(`${data.rows.length} registros exportados a PDF.`, 'success');
    }

    function getTransactionMetadata() {
      const existing = editingTransactionId ? state.transactions.find(item => item.id === editingTransactionId)?.metadata : null;
      const metadata = { ...(existing && typeof existing === 'object' ? existing : {}), source: 'giko_admin' };
      if (form.elements.type.value === 'transfer') {
        const recipientId = form.elements.recipient_user_id.value;
        if (!recipientId || recipientId === form.elements.user_id.value) {
          throw new Error('Una transferencia requiere un destinatario distinto del remitente.');
        }
        metadata.to_user_id = recipientId;
      } else {
        delete metadata.to_user_id;
        delete metadata.recipient_id;
      }
      return metadata;
    }

    async function saveForm(event) {
      event.preventDefault();
      const submit = document.getElementById('modalSubmit');
      if (editingCatalog?.kind === 'locations' && !locationDetailsStep) {
        if (!hasLocationCoordinates(locationDraft) || !locationDraft.address) {
          toast('Marca un punto en el mapa y espera a que se encuentre la dirección.', 'error');
          return;
        }
        renderLocationDetailsStep();
        return;
      }
      submit.disabled = true;
      try {
        if (editingUserId) {
          const payload = {
            full_name: form.elements.full_name.value.trim() || null,
            email: form.elements.email.value.trim() || null,
            phone: form.elements.phone.value.trim() || null,
            avatar_url: form.elements.avatar_url.value.trim() || null
          };
          const { error } = await db.from('user_profiles').update(payload).eq('id', editingUserId);
          if (error) throw error;
          toast('Perfil actualizado.', 'success');
        } else if (editingIpRecord?.kind === 'control') {
          const address = validateIpAddress(form.elements.ip.value);
          const type = form.elements.tipo.value;
          if (!address || !['negra', 'blanca', 'esekaus'].includes(type)) {
            throw new Error('Ingresa una IP/CIDR y selecciona un tipo de regla válido.');
          }
          const { data: duplicates, error: duplicateError } = await db.from('ips_control')
            .select('id').eq('ip', address).eq('tipo', type).limit(5);
          if (duplicateError) throw duplicateError;
          if (duplicates?.some(rule => String(rule.id) !== String(editingIpRecord.id))) {
            throw new Error('Ya existe otra regla con esa IP y tipo de lista.');
          }
          const { data, error } = await db.from('ips_control').update({
            ip: address,
            tipo: type,
            motivo: form.elements.motivo.value.trim() || null,
            activo: form.elements.activo.checked
          }).eq('id', editingIpRecord.id).select('id').maybeSingle();
          if (error) throw error;
          if (!data) throw new Error('La regla ya no existe o no se pudo actualizar.');
          toast('Regla de IP actualizada correctamente.', 'success');
        } else if (editingIpRecord?.kind === 'user') {
          const address = validateIpAddress(form.elements.ip.value, false);
          const userId = form.elements.user_id.value || null;
          if (!editingIpRecord.id && !userId) throw new Error('Selecciona el usuario al que pertenece esta IP.');
          const visits = Number(form.elements.veces_usada.value);
          const blocked = Number(form.elements.intentos_bloqueados.value);
          if (!Number.isInteger(visits) || visits < 0 || !Number.isInteger(blocked) || blocked < 0) {
            throw new Error('Los contadores deben ser números enteros iguales o mayores que cero.');
          }
          const lastSeenValue = form.elements.ultima_vez.value;
          const lastSeen = lastSeenValue ? new Date(lastSeenValue).toISOString() : null;
          const payload = {
            ip: address,
            user_id: userId,
            user_agent: form.elements.user_agent.value.trim() || null,
            es_sospechosa: form.elements.es_sospechosa.checked,
            veces_usada: visits,
            intentos_bloqueados: blocked,
            ultima_vez: lastSeen
          };
          let query = db.from('ips_usuarios').select('id').eq('ip', address);
          query = userId ? query.eq('user_id', userId) : query.is('user_id', null);
          if (editingIpRecord.id) query = query.neq('id', editingIpRecord.id);
          const { data: duplicates, error: duplicateError } = await query.limit(1);
          if (duplicateError) throw duplicateError;
          if (duplicates?.length) throw new Error('Ya existe un registro para este usuario y esta IP.');
          const { data, error } = editingIpRecord.id
            ? await db.from('ips_usuarios').update(payload).eq('id', editingIpRecord.id).select('id').maybeSingle()
            : await db.from('ips_usuarios').insert([payload]).select('id').single();
          if (error) throw error;
          if (!data) throw new Error(editingIpRecord.id
            ? 'El registro ya no existe o no se pudo actualizar.'
            : 'No se pudo crear el registro de IP.');
          toast(editingIpRecord.id
            ? 'Registro de IP de usuario actualizado correctamente.'
            : 'Registro de IP de usuario creado correctamente.', 'success');
        } else if (editingCatalog) {
          const config = CATALOG_CONFIG[editingCatalog.kind];
          const payload = {};
          for (const column of config.columns) {
            const control = form.elements[column.key];
            if (column.type === 'checkbox') {
              payload[column.key] = control.checked;
            } else if (column.type === 'number') {
              const value = control.value.trim();
              payload[column.key] = value === '' ? null : Number(value);
              if (payload[column.key] !== null && !Number.isFinite(payload[column.key])) {
                throw new Error(`El valor de "${column.label}" no es válido.`);
              }
              if (payload[column.key] !== null && column.min !== undefined && payload[column.key] < Number(column.min)) {
                throw new Error(`"${column.label}" debe ser como mínimo ${column.min}.`);
              }
              if (payload[column.key] !== null && column.max !== undefined && payload[column.key] > Number(column.max)) {
                throw new Error(`"${column.label}" debe ser como máximo ${column.max}.`);
              }
              if (column.step === '1' && payload[column.key] !== null && !Number.isInteger(payload[column.key])) {
                throw new Error(`"${column.label}" debe ser un número entero.`);
              }
            } else {
              payload[column.key] = control.value.trim() || null;
            }
          }
          const query = editingCatalog.id
            ? db.from(config.table).update(payload).eq('id', editingCatalog.id)
            : db.from(config.table).insert([payload]);
          const { error } = await query;
          if (error) throw error;
          toast(`${config.singular[0].toUpperCase()}${config.singular.slice(1)} ${editingCatalog.id ? 'actualizado' : 'creado'} correctamente.`, 'success');
        } else if (editingTransactionId) {
          const amount = Number(form.elements.amount.value);
          if (!Number.isFinite(amount) || amount <= 0) throw new Error('El monto debe ser mayor que cero.');
          const { error } = await db.from('transactions').update({
            user_id: form.elements.user_id.value,
            amount,
            type: form.elements.type.value,
            status: form.elements.status.value,
            description: form.elements.description.value.trim() || null,
            metadata: getTransactionMetadata()
          }).eq('id', editingTransactionId);
          if (error) throw error;
          toast('Transacción actualizada.', 'success');
        } else {
          const amount = Number(form.elements.amount.value);
          if (!Number.isFinite(amount) || amount <= 0) throw new Error('El monto debe ser mayor que cero.');
          const { error } = await db.from('transactions').insert([{
            user_id: form.elements.user_id.value,
            amount,
            type: form.elements.type.value,
            description: form.elements.description.value.trim() || null,
            status: form.elements.status.value || 'completed',
            metadata: getTransactionMetadata()
          }]);
          if (error) throw error;
          toast('Movimiento registrado.', 'success');
        }
        closeModal();
        await loadData();
      } catch (error) {
        console.error('Error guardando datos:', error);
        toast(`No se pudo guardar: ${error.message || 'Error desconocido'}`, 'error');
      } finally {
        submit.disabled = false;
      }
    }

    async function clearUserHistory(userId) {
      const user = getUser(userId);
      if (!user) return toast('No se encontró el usuario seleccionado.', 'error');
      if (!confirm(`¿Borrar el historial financiero de ${user.full_name || user.email || user.id} y conservar su balance actual? Las recargas vinculadas a esas transacciones también se borrarán según la relación de la base de datos.`)) return;
      const oldTransactions = state.transactions.filter(item => item.user_id === userId);
      const oldTransactionIds = new Set(oldTransactions.map(item => item.id));
      const oldRecharges = state.recharges.filter(item => oldTransactionIds.has(item.transaction_id));
      const previousBalance = balancesByUser()[userId] || 0;
      let deleted = false;
      try {
        const { error } = await db.from('transactions').delete().eq('user_id', userId);
        if (error) throw error;
        deleted = true;
        const remainingTransactions = await fetchAll('transactions', 'id, user_id, amount, type, description, status, metadata, created_at', 'created_at');
        const balanceAfterDelete = balancesByUser(remainingTransactions)[userId] || 0;
        const adjustment = Number((previousBalance - balanceAfterDelete).toFixed(2));
        if (adjustment !== 0) {
          const { error: adjustmentError } = await db.from('transactions').insert([{
            user_id: userId,
            amount: Math.abs(adjustment),
            type: adjustment > 0 ? 'deposit' : 'withdrawal',
            status: 'completed',
            description: 'Ajuste de balance tras borrar historial',
            metadata: { source: 'giko_admin_history_clear', created_at: new Date().toISOString() }
          }]);
          if (adjustmentError) throw adjustmentError;
        }
        toast('Historial borrado y balance conservado.', 'success');
        await loadData();
      } catch (error) {
        console.error('Error borrando historial:', error);
        if (deleted) {
          try {
            if (oldTransactions.length) {
              const { error: restoreError } = await db.from('transactions').insert(oldTransactions);
              if (restoreError) throw restoreError;
            }
            if (oldRecharges.length) {
              const { error: rechargeRestoreError } = await db.from('game_recharges').insert(oldRecharges);
              if (rechargeRestoreError) throw rechargeRestoreError;
            }
          } catch (restoreError) {
            console.error('Error restaurando el historial tras fallo:', restoreError);
            toast(`Falló el borrado y también la restauración: ${restoreError.message || 'Error desconocido'}. Verifica la base de datos.`, 'error');
            await loadData();
            return;
          }
        }
        toast(`No se pudo borrar el historial; se intentó restaurar: ${error.message || 'Error desconocido'}`, 'error');
        await loadData();
      }
    }

    async function deleteTransaction(transactionId) {
      const transaction = state.transactions.find(item => item.id === transactionId);
      if (!transaction) return toast('No se encontró la transacción seleccionada.', 'error');
      const rechargeCount = state.recharges.filter(item => item.transaction_id === transactionId).length;
      const rechargeWarning = rechargeCount ? ` También se eliminará${rechargeCount > 1 ? 'n' : ''} ${rechargeCount} recarga${rechargeCount > 1 ? 's' : ''} vinculada${rechargeCount > 1 ? 's' : ''}.` : '';
      if (!confirm(`¿Eliminar la transacción de ${money(transaction.amount)} de ${userName(transaction.user_id)}? Esta acción es irreversible.${rechargeWarning}`)) return;
      try {
        const { error } = await db.from('transactions').delete().eq('id', transactionId);
        if (error) throw error;
        toast('Transacción eliminada.', 'success');
        await loadData();
      } catch (error) {
        console.error('Error eliminando transacción:', error);
        toast(`No se pudo eliminar la transacción: ${error.message || 'Error desconocido'}`, 'error');
      }
    }

    function switchView(view) {
      state.view = view;
      state.search = '';
      render();
    }

    function applyTheme(theme) {
      const selectedTheme = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = selectedTheme;
      const darkMode = selectedTheme === 'dark';
      const button = document.getElementById('themeToggle');
      button.setAttribute('aria-label', darkMode ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
      button.title = darkMode ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro';
      button.innerHTML = darkMode
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg><span>Modo claro</span>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path></svg><span>Modo oscuro</span>';
      try {
        localStorage.setItem('giko-admin-theme-v2', selectedTheme);
      } catch (error) {
        console.warn('No se pudo guardar la preferencia de tema:', error);
      }
    }

    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');

    function updateSidebarToggle() {
      const expanded = !sidebar.classList.contains('collapsed');
      const label = expanded ? 'Contraer menú' : 'Expandir menú';
      sidebarToggle.setAttribute('aria-expanded', String(expanded));
      sidebarToggle.setAttribute('aria-label', label);
      sidebarToggle.title = label;
    }

    try {
      if (localStorage.getItem('giko-admin-sidebar-collapsed') === 'true') {
        sidebar.classList.add('collapsed');
      }
    } catch (error) {
      console.warn('No se pudo leer la preferencia del menú lateral:', error);
    }
    updateSidebarToggle();
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      updateSidebarToggle();
      try {
        localStorage.setItem('giko-admin-sidebar-collapsed', String(sidebar.classList.contains('collapsed')));
      } catch (error) {
        console.warn('No se pudo guardar la preferencia del menú lateral:', error);
      }
    });

    document.querySelectorAll('.nav button').forEach(button => {
      button.addEventListener('click', () => switchView(button.dataset.view));
    });
    let savedTheme = 'dark';
    try {
      savedTheme = localStorage.getItem('giko-admin-theme-v2') || 'dark';
    } catch (error) {
      console.warn('No se pudo leer la preferencia de tema:', error);
    }
    applyTheme(savedTheme);
    document.getElementById('themeToggle').addEventListener('click', () => {
      applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalBack').addEventListener('click', returnToLocationMap);
    backdrop.addEventListener('click', event => { if (event.target === backdrop) closeModal(); });
    form.addEventListener('submit', saveForm);
    loadData();
  </script>
</body>
</html>
